name: Build OrangeFox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential python-is-python3 zip curl zlib1g-dev libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libncurses5-dev ccache bc rsync
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup Git
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"

      - name: Free Disk Space & Setup 12GB Swap
        run: |
          df -h / /mnt
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /usr/share/swift \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/local/share/chromium \
                      /opt/hostedtoolcache/CodeQL \
                      /opt/az
          sudo apt-get clean
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt

      - name: Sync OrangeFox (fast shallow)
        run: |
          mkdir -p ~/fox && cd ~/fox
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          repo sync -c --no-tags --no-clone-bundle --force-sync -j$(nproc --all)

      - name: Fix CrashRecovery APEX classpath in fox_16.0
        run: |
          cd ~/fox
          echo 'PRODUCT_APEX_SYSTEM_SERVER_JARS += com.android.crashrecovery:service-crashrecovery' >> build/make/target/product/base_system.mk

      - name: Clone device tree
        run: |
          rm -rf ~/fox/device/xiaomi/mondrian ~/fox/device/xiaomi/sm84xx-common
          mkdir -p ~/fox/device/xiaomi/aurora
          cp -a $GITHUB_WORKSPACE/. ~/fox/device/xiaomi/aurora/
          rm -rf ~/fox/device/xiaomi/aurora/.git ~/fox/device/xiaomi/aurora/.github

      - name: Build
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export SKIP_ABI_CHECKS=true
          rm -rf ~/fox/cts
          source build/envsetup.sh
          cat build/release/release_config_map.mk build/release/release_config_map.textproto 2>/dev/null | head -n 40
          lunch twrp_aurora-bp2a-eng || lunch twrp_aurora-bp3a-eng || lunch twrp_aurora-bp1a-eng
          SKIP_ABI_CHECKS=true mka vendorbootimage -j4
          lunch twrp_aurora-${REL:-bp2a}-eng
          echo "Detected release config: ${REL:-bp2a}"
          lunch twrp_aurora-${REL:-bp2a}-eng
          SKIP_ABI_CHECKS=true mka vendorbootimage -j4

      - name: Upload system libs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-system-lib64
          path: ~/fox/out/target/product/aurora/system/lib64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-aurora
          path: |
            ~/fox/out/target/product/aurora/vendor_boot.img
            ~/fox/out/target/product/aurora/OrangeFox*.zip
